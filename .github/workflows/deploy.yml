name: Deploy to MonkeyBytes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Trigger MonkeyBytes Server Reinstall/Pull
      run: |
        curl -X POST "https://dash.monkey-network.xyz/api/client/servers/${{ secrets.PTERO_SERVER_ID }}/settings/reinstall" \
          -H "Authorization: Bearer ${{ secrets.PTERO_API_KEY }}" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json"
          
    - name: Restart Bot Server
      run: |
        curl -X POST "https://dash.monkey-network.xyz/api/client/servers/${{ secrets.PTERO_SERVER_ID }}/power" \
          -H "Authorization: Bearer ${{ secrets.PTERO_API_KEY }}" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          -d '{"signal": "restart"}'
